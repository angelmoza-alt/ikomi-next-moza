# Despliegue en Render (Blueprint). Render > New > Blueprint > seleccionar este repositorio.
services:
  - type: web
    name: ikomi-next-moza
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
